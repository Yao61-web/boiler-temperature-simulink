name: Simulink boiler control validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out models
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install MATLAB and Simulink
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2025b
          products: Simulink
      - name: Build and simulate block diagrams
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: build_models; run_simulink_tests;
      - name: Save models, raw data, figures and execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simulink-results
          path: |
            generated_slx/
            results_*/
          if-no-files-found: warn
          retention-days: 7
